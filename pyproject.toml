[project]
name = "atlas"
version = "0.1.0"
description = "Local-CLI agent orchestrator + metrics logger for a phase-gated dev workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # plumb — pin commit SHA once available; optional for Phase 1 stubs
    # "plumb @ git+https://github.com/example/plumb.git@<sha>",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/atlas"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
