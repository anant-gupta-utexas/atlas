[project]
name = "atlas"
version = "1.0.0"
description = "Local-CLI agent orchestrator + metrics logger for a phase-gated dev workflow."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "plumb",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
atlas = "atlas.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]
# Install content-pipeline in-process integration (Mode A, LIB: stages).
# Requires content-pipeline checked out as a sibling at ../content-pipeline.
# Without this extra, --workflow job fails cleanly and names --workflow job_cli.
job = ["content-pipeline"]

[tool.uv.sources]
plumb = { path = "../plumb", editable = true }
content-pipeline = { path = "../content-pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: end-to-end tests requiring a real git repo and stub plugins",
]
addopts = "--ignore=tests/e2e"

[tool.coverage.run]
source = ["src/atlas"]
omit = [
    "src/atlas/cli.py",              # thin Typer wrapper; tested via E2E / integration
    "src/atlas/post_commit_hook.py", # runs in a separate subprocess (git hook)
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src/atlas"]

[[tool.mypy.overrides]]
# content-pipeline's own "src.*" namespace — an optional dependency (T2.6).
# library_adapters/* import it lazily, function-local, so atlas's own code is
# unaffected whether or not content-pipeline is installed in the environment
# running mypy; this override just stops mypy treating those imports as errors.
module = "src.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP007"]  # allow X | Y union syntax for older-mypy compat
