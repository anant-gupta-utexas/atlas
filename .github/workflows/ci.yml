name: CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Check out plumb at v1.0.0
        uses: actions/checkout@v4
        with:
          repository: anant-gupta-utexas/plumb
          ref: v1.0.1
          path: plumb

      - name: Symlink plumb to ../plumb
        run: ln -s "$GITHUB_WORKSPACE/plumb" "$GITHUB_WORKSPACE/../plumb"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit + integration tests with coverage
        run: |
          uv run pytest \
            --cov=src/atlas \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  lint:
    name: Lint + Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: ruff check
        run: uvx ruff check src tests

      - name: ruff format check
        run: uvx ruff format --check src tests

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out plumb at v1.0.0
        uses: actions/checkout@v4
        with:
          repository: anant-gupta-utexas/plumb
          ref: v1.0.1
          path: plumb

      - name: Symlink plumb to ../plumb
        run: ln -s "$GITHUB_WORKSPACE/plumb" "$GITHUB_WORKSPACE/../plumb"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: mypy
        run: uv run mypy src

  e2e:
    name: E2E (stub plugins)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Check out plumb at v1.0.0
        uses: actions/checkout@v4
        with:
          repository: anant-gupta-utexas/plumb
          ref: v1.0.1
          path: plumb

      - name: Symlink plumb to ../plumb
        run: ln -s "$GITHUB_WORKSPACE/plumb" "$GITHUB_WORKSPACE/../plumb"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@atlas.local"
          git config --global user.name "Atlas CI"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run E2E tests
        run: uv run pytest tests/e2e -m e2e -v
