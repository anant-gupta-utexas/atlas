name: CI

on:
  push:
    branches: ["main", "atlas/**"]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Check out plumb at v1.0.0
        uses: actions/checkout@v4
        with:
          repository: anant-gupta-utexas/plumb
          ref: v1.0.1
          path: plumb

      - name: Symlink plumb to ../plumb
        run: ln -s "$GITHUB_WORKSPACE/plumb" "$GITHUB_WORKSPACE/../plumb"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (core — no job extra)
        run: uv sync --extra dev

      - name: Run unit + integration tests with coverage
        # Includes test_job_workflow_content_pipeline_not_installed_fails_cleanly
        # (verifies the dependency-free path and the job_cli error hint) and the
        # job_cli variant tests — all pass without content-pipeline installed.
        run: |
          uv run pytest \
            --cov=src/atlas \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  # T2.9: Job-extra leg — runs the full test suite with content-pipeline
  # installed as the job optional extra.  Requires content-pipeline checked
  # out as a sibling at ../content-pipeline; this job is skipped unless a
  # content-pipeline repo secret or path is available.
  #
  # To enable: check out content-pipeline in CI using an actions/checkout step
  # targeting your private content-pipeline repo, then uncomment the job.
  #
  # test-job-extra:
  #   name: Test (job extra, Python 3.13)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Check out plumb
  #       uses: actions/checkout@v4
  #       with:
  #         repository: anant-gupta-utexas/plumb
  #         ref: v1.0.1
  #         path: plumb
  #     - name: Symlink plumb to ../plumb
  #       run: ln -s "$GITHUB_WORKSPACE/plumb" "$GITHUB_WORKSPACE/../plumb"
  #     - name: Check out content-pipeline
  #       uses: actions/checkout@v4
  #       with:
  #         repository: <org>/content-pipeline   # replace with real repo path
  #         path: content-pipeline
  #     - name: Symlink content-pipeline to ../content-pipeline
  #       run: ln -s "$GITHUB_WORKSPACE/content-pipeline" "$GITHUB_WORKSPACE/../content-pipeline"
  #     - name: Install uv
  #       uses: astral-sh/setup-uv@v4
  #       with:
  #         python-version: "3.13"
  #     - name: Install dependencies with job extra
  #       run: uv sync --extra dev --extra job
  #     - name: Run full test suite
  #       run: uv run pytest --cov=src/atlas --cov-fail-under=80 -v

  lint:
    name: Lint + Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: ruff check
        run: uvx ruff check src tests

      - name: ruff format check
        run: uvx ruff format --check src tests

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out plumb at v1.0.0
        uses: actions/checkout@v4
        with:
          repository: anant-gupta-utexas/plumb
          ref: v1.0.1
          path: plumb

      - name: Symlink plumb to ../plumb
        run: ln -s "$GITHUB_WORKSPACE/plumb" "$GITHUB_WORKSPACE/../plumb"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: mypy
        run: uv run mypy src

  e2e:
    name: E2E (stub plugins)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Check out plumb at v1.0.0
        uses: actions/checkout@v4
        with:
          repository: anant-gupta-utexas/plumb
          ref: v1.0.1
          path: plumb

      - name: Symlink plumb to ../plumb
        run: ln -s "$GITHUB_WORKSPACE/plumb" "$GITHUB_WORKSPACE/../plumb"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@atlas.local"
          git config --global user.name "Atlas CI"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run E2E tests
        run: uv run pytest tests/e2e -m e2e -v
